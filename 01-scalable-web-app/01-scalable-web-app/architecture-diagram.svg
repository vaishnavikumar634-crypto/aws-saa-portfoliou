  <polyline points="60,130 60,340 200,340" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="1020,130 1020,180 875,180 875,340 682,340" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="227,335 227,410" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="647,335 647,410" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="227,465 227,540 230,540" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="637,465 637,540 650,540" fill="none" stroke="#545B64" stroke-width="1.5" marker-end="url(#arw)"/>
  <polyline points="285,567 650,567" fill="none" stroke="#3B48CC" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="470" y="560" text-anchor="middle" font-size="9" fill="#3B48CC">sync replication</text>

  <!-- legend -->
