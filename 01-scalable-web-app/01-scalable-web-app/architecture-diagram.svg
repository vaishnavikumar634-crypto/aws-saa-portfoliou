  </g>
  <text x="60" y="105" text-anchor="middle" font-size="10" fill="white" font-weight="bold">R53</text>
  <text x="60" y="145" text-anchor="middle" font-size="11" fill="#232F3E">Route 53</text>

  <g filter="url(#sh)">
