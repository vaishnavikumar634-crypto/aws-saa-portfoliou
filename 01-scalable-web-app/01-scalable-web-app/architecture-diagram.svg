  <rect x="580" y="380" width="340" height="110" rx="4" fill="#FDF2E9" stroke="#D86613" stroke-dasharray="4,2"/>
  <text x="590" y="396" font-size="9" fill="#D86613">Private Subnet — App Tier</text>
  <g filter="url(#sh)"><rect x="610" y="410" width="55" height="55" rx="8" fill="#ED7100"/></g>
  <text x="637" y="440" text-anchor="middle" font-size="9" fill="white" font-weight="bold">EC2</text>
  <text x="637" y="482" text-anchor="middle" font-size="10" fill="#232F3E">EC2 (in ASG)</text>

