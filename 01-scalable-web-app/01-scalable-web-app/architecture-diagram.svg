  <rect x="132" y="688" width="12" height="12" fill="#ED7100"/><text x="148" y="698" font-size="9" fill="#232F3E">Compute</text>
  <rect x="215" y="688" width="12" height="12" fill="#3B48CC"/><text x="231" y="698" font-size="9" fill="#232F3E">Database</text>
  <rect x="300" y="688" width="12" height="12" fill="#8C4FFF"/><text x="316" y="698" font-size="9" fill="#232F3E">Network/Edge</text>
  <rect x="410" y="688" width="12" height="12" fill="#545B64"/><text x="426" y="698" font-size="9" fill="#232F3E">Networking</text>
  <text x="700" y="698" font-size="9" fill="#666">CloudWatch + SNS monitor all tiers · SSM Session Manager for access · SGs restrict ALB→EC2→RDS</text>
